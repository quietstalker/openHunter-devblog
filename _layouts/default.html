<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/{% if page.cover %}{{ page.cover }}{% else %}social.png{% endif %}">
<link rel="icon" href="{{ site.baseurl }}/assets/img/favicon.png">
<link rel="stylesheet" href="{{ site.baseurl }}/assets/style.css">
</head>
<body>
<header>
  <a class="brand" href="{{ site.baseurl }}/"><img src="{{ site.baseurl }}/assets/img/mark.svg" alt=""><span>open<b>hunter</b></span> <em>devblog</em></a>
</header>
<main>
{{ content }}
</main>
<footer>
  openHunter ships no game files. It reads the data from your own installed copy of theHunter Classic.<br>
  An independent fan project, not affiliated with Expansive Worlds or Avalanche Studios Group.
</footer>
</body>
</html>
